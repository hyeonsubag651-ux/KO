<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP 꿀꺽 방지기</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 600px;
        }
        .message {
            font-size: 1.5rem;
            font-weight: bold;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        .ip-box {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        #ip-address {
            border: 1px solid #000;
            padding: 2px 10px;
            min-width: 150px;
            display: inline-block;
        }
        footer {
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="message">
        당신의 아이피를 꿀꺽하기가 귀찮습니다!
    </div>
    
    <div class="ip-box">
        너님의 IP : <span id="ip-address">불러오는 중...</span>
    </div>

    <footer>
        © 2026 Your Name, All rights reserved.
    </footer>
</div>

<script>
    // IP 주소를 가져오는 공개 API 사용
    async function getIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            document.getElementById('ip-address').innerText = data.ip;
        } catch (error) {
            document.getElementById('ip-address').innerText = "확인 불가";
        }
    }

    // 페이지 로드 시 실행
    getIP();
</script>

</body>
</html>
